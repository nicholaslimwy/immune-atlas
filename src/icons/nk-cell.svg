    <circle cx="34" cy="69" r="2.6"/>
    <circle cx="25" cy="70" r="2.2"/>
    <circle cx="42" cy="75" r="2.4"/>
    <circle cx="33" cy="77" r="2.2"/>
    <circle cx="20" cy="56" r="2"/>
    <circle cx="44" cy="67" r="2"/>
  </g>
  <path d="M30 40 C30 27 42 19 55 20 C68 21 78 31 77 45 C76 58 66 67 54 66 C49 65 47 61 44 58 C41 55 36 56 33 53 C30 50 30 45 30 40 Z" fill="#8E5BB5" stroke="#1F2933" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
