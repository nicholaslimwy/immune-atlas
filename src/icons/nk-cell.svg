<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- NK cell. Cue: large granular lymphocyte: a round, slightly indented nucleus with more cytoplasm than a small lymphocyte, and a cluster of coarse killing granules beside the indent. No antigen receptor glyph (it has neither a T- nor a B-cell receptor). -->
